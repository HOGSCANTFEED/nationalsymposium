name: Refresh site from form

on:
  schedule:
    # Once a day at 09:17 UTC (~19:17-20:17 AEST/AEDT). Times just before/after
    # the hour avoid the load spike everyone else's midnight/on-the-hour crons hit.
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Build the pages and publish them, retrying if a manual upload lands on
      # main at the same moment. Each attempt rebuilds from the LATEST templates
      # (build.js is deterministic from the form + templates), commits both
      # generated pages, and pushes. A push rejected as "non-fast-forward" just
      # means someone uploaded to GitHub during this run: we sync to the latest
      # main and try again rather than failing the whole run.
      - name: Rebuild and publish index.html and poster.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            node build.js

            if git diff --quiet -- index.html poster.html; then
              echo "No change to index.html or poster.html — nothing to publish."
              exit 0
            fi

            git add index.html poster.html
            git commit -m "Refresh site from form submission"

            if git push; then
              echo "Published on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt — a manual upload landed on main at the same time. Syncing to the latest and rebuilding..."
            git fetch origin main
            git reset --hard origin/main
            sleep 5
          done

          echo "Could not publish after 5 attempts — leaving this run red so it gets a look."
          exit 1
